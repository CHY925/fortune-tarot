@media(max-width:720px){.shell{padding-top:14px}.masthead:before{letter-spacing:5px;font-size:15px}.panel{outline-offset:1px;outline-width:3px}.category-grid{gap:13px}.category{min-height:208px}.category:before{top:7px;font-size:9px}.category:after{bottom:6px;font-size:8px}.category-name{font-size:21px}.fortune-card{width:min(100%,390px)}#app:before,#app:after{width:48vw;height:27vw;opacity:.45}}

/* V3.1: illustrated, gold-foil tarot card backs */
.card-back{background:#70518e url('assets/tarot-back-ornate.jpg') center / cover no-repeat!important;position:relative;overflow:hidden;border:3px solid #efd3a0!important;border-radius:13px;box-shadow:inset 0 0 0 2px #795b96,0 0 0 1px #9e79ac,0 12px 24px #49325a66!important}
.card-back::before{content:"";position:absolute;inset:6px;border:1.5px solid #f7dda6;border-radius:7px;box-shadow:inset 0 0 0 3px #4e36608a;pointer-events:none;z-index:2}
.card-back::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 12%,#fff1bf25 42%,transparent 65%);pointer-events:none;z-index:3}
.card-back .back-inner{opacity:1!important;position:absolute;inset:0;border:0;display:flex;align-items:center;justify-content:center;background:transparent!important;pointer-events:none}
.card-back .tarot-illustration{width:100%;height:100%;opacity:.66;filter:drop-shadow(0 0 2px #5e3975);display:block}


/* V3.2 修正：背景只呈現星光與柔和雲霧，不再疊加其他頁面的截圖 */

 {stars:1,title:'謹慎理財的一天',reading:'今天在金錢安排上可能遇到一些小狀況，例如臨時支出或預算超出預期。先不用太擔心，重新檢視開銷，就能逐步找回掌控感。',advice:'暫緩非必要的購物，優先保留日常所需預算。'}]}
};
const app=document.getElementById('app');
const storageKey='daily-tarot-v1';
let active=null,locked=false,animationToken=0;
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function displayDate(){return new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date())}
function loadRecords(){try{const data=JSON.parse(localStorage.getItem(storageKey)||'{}');return data&&typeof data==='object'?data:{}}catch{return {}}}
function recordFor(key){const item=loadRecords()[key];return item&&item.date===today()&&Number.isInteger(item.index)&&item.index>=0&&item.index<5?item:null}
function saveRecord(key,index){const records=loadRecords();records[key]={date:today(),index};try{localStorage.setItem(storageKey,JSON.stringify(records))}catch(e){console.warn('無法儲存抽籤結果',e)}}
function theme(c){return `--ink:${c.ink};--line:${c.line};--pale:${c.pale}`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shell(content){app.innerHTML=`<main class="shell">${content}<p class="footer-note">✦ 星辰的指引，送給今天的你 ✦<br>運勢內容僅供娛樂與生活靈感參考</p></main>`}
function header(){return `<header class="masthead"><div class="hero-sigil" aria-hidden="true"><span class="hero-orbit">✦</span><span class="hero-moon">☾</span><span class="hero-orbit">✧</span></div><div class="eyebrow">A LITTLE MAGIC FOR TODAY</div><h1>今日運勢抽籤</h1><p class="subtitle">讓星辰為你揭曉今日的指引</p><div class="date-pill">☾ <span>${displayDate()}</span> ✦</div></header>`}
function showHome(){animationToken++;locked=false;active=null;shell(`${header()}<section class="panel"><h2 class="section-title">選擇你的今日指引</h2><p class="section-hint">四種運勢，每天各有一次與星辰相遇的機會</p><div class="category-grid">${Object.entries(CATEGORIES).map(([key,c])=>`<button class="category" style="${theme(c)}" data-category="${key}" aria-label="${c.name}，${recordFor(key)?'今日已抽，查看結果':'尚未抽籤'}"><span class="category-crest" aria-hidden="true"><span class="crest-rays">✧ · ✦ · ✧</span><span class="category-icon">${c.symbol}</span><span class="crest-bottom">☾ ✦ ☽</span></span><span class="category-name">${c.short}</span><span class="category-en">${c.en}</span><span class="status">${recordFor(key)?'✓ 今日已抽':'✧ 尚未抽籤'}</span></button>`).join('')}</div></section>`);app.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>openCategory(b.dataset.category)));window.scrollTo({top:0,behavior:'instant'})}
function backButton(){return '<button class="back-link" id="back-top">← 返回首頁</button>'}
function bindBack(){document.getElementById('back-top')?.addEventListener('click',showHome);document.getElementById('back-bottom')?.addEventListener('click',showHome)}
function shuffled(){const a=[0,1,2,3,4];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function cardBack(){return `<div class="card-back"><div class="back-inner"><svg class="tarot-illustration" viewBox="0 0 180 285" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<defs><linearGradient id="foil" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7d9"/><stop offset=".48" stop-color="#d7ad6e"/><stop offset="1" stop-color="#fff1c5"/></linearGradient></defs>
<g fill="none" stroke="url(#foil)" stroke-width="1.3"><rect x="8" y="8" width="164" height="269" rx="9"/><rect x="15" y="15" width="150" height="255" rx="7" stroke-width=".7"/><path d="M90 19v27m0 193v27M18 142h30m84 0h30"/><path d="M32 37q35 0 58 26 23-26 58-26M32 248q35 0 58-26 23 26 58 26"/><circle cx="90" cy="142" r="55"/><circle cx="90" cy="142" r="47" stroke-dasharray="2 7"/><path d="M90 73v17m0 104v17M21 142h15m108 0h15"/><path d="M90 84l5 10-5 10-5-10zM90 180l5 10-5 10-5-10z"/></g>
<g fill="url(#foil)"><path d="M103 103a38 38 0 1 0 0 78 41 41 0 1 1 0-78Z"/><path d="M125 95l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><path d="M65 116l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M128 168l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><circle cx="58" cy="172" r="2"/><circle cx="118" cy="128" r="2"/><circle cx="90" cy="43" r="2"/><circle cx="90" cy="243" r="2"/></g>
<g fill="none" stroke="url(#foil)" stroke-width="1"><path d="M28 59q-6-17 8-25-3 13 10 16-13 2-18 9ZM152 59q6-17-8-25 3 13-10 16 13 2 18 9ZM28 226q-6 17 8 25-3-13 10-16-13-2-18-9ZM152 226q6 17-8 25 3-13-10-16 13-2 18-9Z"/></g></svg></div></div>`}
function fanStyles(i){const offsets=[-2,-1,0,1,2],n=offsets[i];return `--x:calc(${n} * clamp(52px, 11vw, 117px));--y:${Math.abs(n)*15}px;--r:${n*11}deg;--z:${5-Math.abs(n)}`}
function openCategory(key){if(locked)return;active=key;const c=CATEGORIES[key];if(recordFor(key)){showResult(key,recordFor(key).index,true);return}const positions=shuffled();shell(`${backButton()}<section class="panel draw-panel" style="${theme(c)}"><div class="draw-head"><div class="ornament" aria-hidden="true">✧ ☾ ✧</div><h2>${c.symbol} 今日${c.name}</h2><p>靜下心來，憑直覺選擇一張命運之牌 ✦</p></div><div class="fan" aria-label="五張背面相同的運勢卡片">${positions.map((index,i)=>`<button class="fan-card" style="${fanStyles(i)}" data-fortune="${index}" aria-label="選擇第 ${i+1} 張卡片">${cardBack()}</button>`).join('')}</div><p class="fan-hint">✦ 輕觸一張卡片，揭曉今日的指引 ✦</p></section>`);bindBack();app.querySelectorAll('.fan-card').forEach(b=>b.addEventListener('click',()=>drawCard(key,Number(b.dataset.fortune),b)));window.scrollTo({top:0,behavior:'instant'})}
function fortuneMarkup(key,index){const c=CATEGORIES[key],f=c.fortunes[index];return `<article class="fortune-card" style="${theme(c)}" aria-label="${c.name}，${f.stars} 顆星"><div class="fortune-inner"><span class="corner-decoration top-left" aria-hidden="true">✧</span><span class="corner-decoration top-right" aria-hidden="true">✧</span><span class="corner-decoration bottom-left" aria-hidden="true">✧</span><span class="corner-decoration bottom-right" aria-hidden="true">✧</span><div class="fortune-symbol" aria-hidden="true">${c.symbol}</div><div class="fortune-label">今日${c.name}</div><div class="fortune-stars" aria-label="五顆星中獲得 ${f.stars} 顆星">${'★'.repeat(f.stars)}${'☆'.repeat(5-f.stars)}</div><div class="fortune-title">${escapeHtml(f.title)}</div><div class="fortune-divider"></div><p class="fortune-reading">${escapeHtml(f.reading)}</p><div class="advice"><strong>✧ 今日小建議</strong><p>${escapeHtml(f.advice)}</p></div><div class="card-tail" aria-hidden="true">✦ ☾ ✦</div></div></article>`}
function showResult(key,index,already){const c=CATEGORIES[key];locked=false;shell(`${backButton()}<section class="panel result-area" style="${theme(c)}"><div class="draw-head"><div class="ornament" aria-hidden="true">✦ ☾ ✦</div><h2>星辰為你揭曉的指引</h2></div>${fortuneMarkup(key,index)}${already?`<p class="already">今天已經抽過${c.name}啦！<br>明天再來吧～ ✦</p>`:''}<button class="home-btn" id="back-bottom">返回首頁</button></section>`);bindBack();window.scrollTo({top:0,behavior:'smooth'})}
function sparkle(){const layer=document.getElementById('sparkle-layer');const symbols=['✦','✧','⋆','✺'];for(let i=0;i<18;i++){const s=document.createElement('span');s.className='sparkle';s.textContent=symbols[i%symbols.length];s.style.left=`${50+(Math.random()-.5)*48}%`;s.style.top=`${44+(Math.random()-.5)*40}%`;s.style.animationDelay=`${Math.random()*.45}s`;layer.appendChild(s);setTimeout(()=>s.remove(),1700)}}
function delay(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function drawCard(key,index,button){if(locked||recordFor(key))return;locked=true;const token=++animationToken;const others=Array.from(app.querySelectorAll('.fan-card'));others.forEach(b=>{b.disabled=true;if(b!==button)b.classList.add('is-gone')});const rect=button.getBoundingClientRect();const overlay=document.createElement('div');overlay.className='flip-stage';overlay.style.cssText=`left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px;transform:rotate(${(others.indexOf(button)-2)*11}deg);${theme(CATEGORIES[key])}`;overlay.innerHTML=`<div class="flip-rotator"><div class="flip-side">${cardBack()}</div><div class="flip-side flip-front"><span>${CATEGORIES[key].symbol}<br>✦ ✧ ✦</span></div></div>`;document.body.appendChild(overlay);button.style.visibility='hidden';await delay(80);if(token!==animationToken){overlay.remove();return}const targetWidth=Math.min(window.innerWidth-50,310),targetHeight=targetWidth*1.54;overlay.style.left=`${(window.innerWidth-targetWidth)/2}px`;overlay.style.top=`${Math.max(18,(window.innerHeight-targetHeight)/2)}px`;overlay.style.width=`${targetWidth}px`;overlay.style.height=`${targetHeight}px`;overlay.style.transform='rotate(0deg)';await delay(750);if(token!==animationToken){overlay.remove();return}overlay.querySelector('.flip-rotator').classList.add('revealed');sparkle();await delay(850);if(token!==animationToken){overlay.remove();return}saveRecord(key,index);overlay.remove();showResult(key,index,false)}
window.addEventListener('storage',()=>{if(!locked){if(active){const record=recordFor(active);if(record)showResult(active,record.index,true)}else showHome()}});
showHome();
</script>
